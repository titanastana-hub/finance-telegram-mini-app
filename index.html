<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f7fa" />
    <title>Новый расход</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">₸</div>
        <div>
          <h1>Новый расход</h1>
          <p class="eyebrow">УЧЁТ ФИНАНСОВ</p>
        </div>
      </header>

      <form class="expense-form" id="expense-form">
        <section class="amount-card">
          <label for="amount">Сумма</label>
          <div class="amount-row">
            <input id="amount" name="amount" inputmode="decimal" autocomplete="off" autofocus placeholder="0" />
            <span>₸</span>
          </div>
        </section>

        <section class="form-card">
          <label class="field">
            <span>Описание</span>
            <input id="description" type="text" placeholder="Например, обед с клиентом" />
          </label>

          <fieldset class="field">
            <legend>Оплата</legend>
            <div class="segments two" data-group="payment_method">
              <button class="active" type="button" data-value="Наличные">Наличные</button>
              <button type="button" data-value="Перевод">Перевод</button>
            </div>
          </fieldset>

          <label class="field">
            <span>Категория</span>
            <select id="category">
              <option>Еда и кафе</option>
              <option>Транспорт</option>
              <option>Покупки</option>
              <option>Здоровье</option>
              <option>Дом</option>
              <option>Комиссии</option>
              <option>Подписки и сервисы</option>
              <option>Прочее</option>
            </select>
          </label>

          <fieldset class="field">
            <legend>Назначение</legend>
            <div class="segments three" data-group="purpose">
              <button class="active" type="button" data-value="Личное">Личное</button>
              <button type="button" data-value="Работа">Работа</button>
              <button type="button" data-value="Дом">Дом</button>
            </div>
          </fieldset>

          <label class="field">
            <span>Комментарий <em>необязательно</em></span>
            <input id="comment" type="text" placeholder="Дополнительная информация" />
          </label>
        </section>

        <p class="error-message" id="error" hidden></p>
        <button class="primary-button submit-button" type="submit">Сохранить расход</button>
        <p class="privacy-note">Данные отправятся только вашему Telegram-боту</p>
      </form>

      <section class="success-card" id="success" hidden>
        <div class="success-icon">✓</div>
        <h1>Расход отправлен</h1>
        <p>Данные переданы вашему Telegram-боту.</p>
      </section>
    </main>
  </body>
</html>
