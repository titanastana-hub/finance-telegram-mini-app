<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Новый расход</title>
    <link rel="stylesheet" href="styles.css?v=5" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js?v=5" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <button class="back-button" id="back-button" type="button" aria-label="Закрыть">‹</button>
        <h1>Новый расход</h1>
        <span class="header-spacer" aria-hidden="true"></span>
      </header>

      <form id="expense-form">
        <section class="rows">
          <label class="row">
            <span class="row-label">Сумма</span>
            <span class="row-control amount-control">
              <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0" />
              <select id="currency" aria-label="Валюта">
                <option value="KZT" selected>₸</option>
                <option value="USD">$</option>
                <option value="EUR">€</option>
                <option value="RUB">₽</option>
                <option value="CNY">¥</option>
              </select>
            </span>
            <span class="chevron">›</span>
          </label>

          <label class="row">
            <span class="row-label">Описание</span>
            <input id="description" class="row-input" type="text" placeholder="Введите описание" />
            <span class="chevron">›</span>
          </label>

          <label class="row">
            <span class="row-label">Способ оплаты</span>
            <select id="payment-method">
              <option value="" selected disabled>Выберите способ</option>
              <option>Наличные</option>
              <option>Перевод</option>
            </select>
            <span class="chevron">›</span>
          </label>

          <label class="row">
            <span class="row-label">Категория</span>
            <select id="category">
              <option value="" selected disabled>Выберите категорию</option>
              <option>Еда и кафе</option>
              <option>Транспорт</option>
              <option>Покупки</option>
              <option>Здоровье</option>
              <option>Дом</option>
              <option>Комиссии</option>
              <option>Подписки и сервисы</option>
              <option>Прочее</option>
            </select>
            <span class="chevron">›</span>
          </label>

          <label class="row">
            <span class="row-label">Назначение</span>
            <select id="purpose">
              <option value="" selected disabled>Выберите назначение</option>
              <option>Личное</option>
              <option>Работа</option>
              <option>Дом</option>
            </select>
            <span class="chevron">›</span>
          </label>

          <label class="row">
            <span class="row-label">Комментарий</span>
            <input id="comment" class="row-input" type="text" placeholder="Введите комментарий" />
            <span class="chevron">›</span>
          </label>
        </section>

        <p class="error-message" id="error" hidden></p>
        <div class="submit-area">
          <button class="save-button" type="submit">Сохранить</button>
        </div>
      </form>

      <section class="success" id="success" hidden>
        <div class="success-icon">✓</div>
        <h2>Расход отправлен</h2>
      </section>
    </main>
  </body>
</html>
